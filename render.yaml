services:
  - type: web
    name: hcbssd-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://hcbssd-clone.netlify.app
    disk:
      name: data
      mountPath: /opt/render/project/src/backend
      sizeGB: 1
